<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ArXiv Manager{% endblock %}</title>
    <script>
        (function() {
            var t = localStorage.getItem('theme');
            if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#1a1a2e', hover: '#16213e' },
                    }
                }
            }
        }
    </script>
    <style>
        .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
        .htmx-request .htmx-indicator { opacity: 1; }
        .htmx-request.htmx-indicator { opacity: 1; }
        .spinner { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 dark:bg-[#0f0f1a] text-gray-800 dark:text-gray-200 font-sans antialiased min-h-screen transition-colors duration-200">
    <nav class="bg-[#1a1a2e] text-white sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="flex items-center justify-between h-14 sm:h-16">
                <a href="/" class="text-lg font-bold tracking-tight">ArXiv Manager</a>
                <div class="flex items-center gap-2">
                    <button id="theme-toggle" class="p-2 rounded-lg hover:bg-white/10 transition-colors" aria-label="Toggle dark mode">
                        <svg id="theme-icon-light" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                        </svg>
                        <svg id="theme-icon-dark" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                        </svg>
                    </button>
                    <button id="nav-toggle" class="lg:hidden p-2 rounded-lg hover:bg-white/10" aria-label="Toggle navigation">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                </div>
                <div id="nav-links" class="hidden lg:flex items-center gap-1">
                    <a href="/" class="px-3 py-2 rounded-lg text-sm font-medium hover:bg-white/10 transition-colors">Dashboard</a>
                    <a href="/author" class="px-3 py-2 rounded-lg text-sm font-medium hover:bg-white/10 transition-colors">Author</a>
                    <a href="/images" class="px-3 py-2 rounded-lg text-sm font-medium hover:bg-white/10 transition-colors">Images</a>
                    <a href="/tasks" class="px-3 py-2 rounded-lg text-sm font-medium hover:bg-white/10 transition-colors">Tasks</a>
                    <a href="/stats" class="px-3 py-2 rounded-lg text-sm font-medium hover:bg-white/10 transition-colors">Stats</a>
                    <a href="/metrics" class="px-3 py-2 rounded-lg text-sm font-medium hover:bg-white/10 transition-colors">Metrics</a>
                    <a href="/analytics/strategies" class="px-3 py-2 rounded-lg text-sm font-medium hover:bg-white/10 transition-colors">Strategies</a>
                </div>
            </div>
            <div id="mobile-nav" class="hidden lg:hidden pb-3 space-y-1">
                <a href="/" class="block px-3 py-2 rounded-lg text-sm font-medium hover:bg-white/10 transition-colors">Dashboard</a>
                <a href="/author" class="block px-3 py-2 rounded-lg text-sm font-medium hover:bg-white/10 transition-colors">Author</a>
                <a href="/images" class="block px-3 py-2 rounded-lg text-sm font-medium hover:bg-white/10 transition-colors">Images</a>
                <a href="/tasks" class="block px-3 py-2 rounded-lg text-sm font-medium hover:bg-white/10 transition-colors">Tasks</a>
                <a href="/stats" class="block px-3 py-2 rounded-lg text-sm font-medium hover:bg-white/10 transition-colors">Stats</a>
                <a href="/metrics" class="block px-3 py-2 rounded-lg text-sm font-medium hover:bg-white/10 transition-colors">Metrics</a>
                <a href="/analytics/strategies" class="block px-3 py-2 rounded-lg text-sm font-medium hover:bg-white/10 transition-colors">Strategies</a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2"></div>

    <script>
        // Theme toggle
        (function() {
            var html = document.documentElement;
            var lightIcon = document.getElementById('theme-icon-light');
            var darkIcon = document.getElementById('theme-icon-dark');
            function updateIcons() {
                var isDark = html.classList.contains('dark');
                lightIcon.classList.toggle('hidden', isDark);
                darkIcon.classList.toggle('hidden', !isDark);
            }
            updateIcons();
            document.getElementById('theme-toggle')?.addEventListener('click', function() {
                html.classList.toggle('dark');
                localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
                updateIcons();
            });
        })();

        // Mobile nav toggle
        document.getElementById('nav-toggle')?.addEventListener('click', function() {
            var el = document.getElementById('mobile-nav');
            el.classList.toggle('hidden');
        });

        // Toast helper
        function showToast(msg, type) {
            type = type || 'success';
            var colors = {success: 'bg-green-600', error: 'bg-red-600', info: 'bg-blue-600'};
            var t = document.createElement('div');
            t.className = (colors[type] || 'bg-gray-700') + ' text-white px-4 py-3 rounded-lg shadow-lg text-sm font-medium animate-bounce-in';
            t.textContent = msg;
            var c = document.getElementById('toast-container');
            c.appendChild(t);
            setTimeout(function() { t.remove(); }, 3000);
        }

        // HTMX error handler
        document.addEventListener('htmx:responseError', function(evt) {
            showToast('Request failed: ' + (evt.detail.xhr.statusText || 'Unknown error'), 'error');
        });
        document.addEventListener('htmx:sendError', function(evt) {
            showToast('Network error — check your connection', 'error');
        });
    </script>
</body>
</html>
