<div class="border border-gray-200 dark:border-gray-700 rounded-lg p-3 mt-2 bg-white dark:bg-gray-800">
  <p class="text-xs font-medium text-gray-400 dark:text-gray-500 mb-2 uppercase tracking-wide">Changes from previous version</p>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
    <div class="bg-red-50 dark:bg-red-900/20 rounded p-2 border border-red-100 dark:border-red-800">
      <p class="text-xs font-medium text-red-400 dark:text-red-300 mb-1 uppercase">Before</p>
      {% if old.question %}
      <p class="text-xs text-red-600 dark:text-red-300 line-through">{{ old.question[:200] }}</p>
      {% endif %}
      {% if old.answer %}
      <p class="text-xs text-red-500 dark:text-red-400 line-through mt-1">→ {{ old.answer[:100] }}</p>
      {% endif %}
    </div>
    <div class="bg-green-50 dark:bg-green-900/20 rounded p-2 border border-green-100 dark:border-green-800">
      <p class="text-xs font-medium text-green-400 dark:text-green-300 mb-1 uppercase">After</p>
      {% if new.question %}
      <p class="text-xs text-green-700 dark:text-green-300">{{ new.question[:200] }}</p>
      {% endif %}
      {% if new.answer %}
      <p class="text-xs text-green-600 dark:text-green-400 mt-1">→ {{ new.answer[:100] }}</p>
      {% endif %}
    </div>
  </div>
</div>
