{% extends "base_layout.html" %}
{% block title %}Tasks — ArXiv Manager{% endblock %}
{% block content %}
<div class="mb-6">
    <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 dark:text-gray-100">Tasks</h1>
    <p class="text-gray-500 dark:text-gray-400 mt-1">Manage Q&A tasks</p>
</div>

<div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-4 sm:p-5 mb-6">
    <div class="flex flex-col sm:flex-row gap-3">
        <div class="flex-1">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </span>
                <input type="text"
                       name="q"
                       placeholder="Search tasks by title, question, or answer..."
                       hx-get="/tasks/table"
                       hx-trigger="keyup changed delay:300ms, search"
                       hx-target="#tasks-table-container"
                       hx-include="[name=status]"
                       hx-indicator="#search-spinner"
                       value="{{ q if q is defined else '' }}"
                       class="w-full pl-9 pr-8 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:ring-2 focus:ring-[#1a1a2e]/20 focus:border-[#1a1a2e]">
                <span id="search-spinner" class="htmx-indicator absolute inset-y-0 right-0 pr-3 flex items-center">
                    <svg class="animate-spin h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                </span>
            </div>
        </div>
        <div class="sm:w-48">
            <select name="status"
                    hx-get="/tasks/table"
                    hx-trigger="change"
                    hx-target="#tasks-table-container"
                    hx-include="[name=q]"
                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-[#1a1a2e]/20 focus:border-[#1a1a2e]">
                <option value="">All statuses</option>
                <option value="draft" {% if status_filter == 'draft' %}selected{% endif %}>Draft</option>
                <option value="validated" {% if status_filter == 'validated' %}selected{% endif %}>Validated</option>
                <option value="submitted" {% if status_filter == 'submitted' %}selected{% endif %}>Submitted</option>
                <option value="approved" {% if status_filter == 'approved' %}selected{% endif %}>Approved</option>
                <option value="rework" {% if status_filter == 'rework' %}selected{% endif %}>Rework</option>
            </select>
        </div>
    </div>
</div>

<div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
    <div id="tasks-table-container">
        {% include "tasks_table.html" %}
    </div>
</div>

<script>
(function() {
    var STORAGE_KEY = 'tasks-col-widths';
    var defaults = {col_id:60, col_title:180, col_question:280, col_status:110, col_difficulty:120, col_actions:130};

    function loadWidths() {
        try { return Object.assign({}, defaults, JSON.parse(localStorage.getItem(STORAGE_KEY))); }
        catch(e) { return Object.assign({}, defaults); }
    }
    function saveWidths(w) { localStorage.setItem(STORAGE_KEY, JSON.stringify(w)); }

    function applyWidths() {
        var w = loadWidths();
        var table = document.getElementById('tasks-datatable');
        if (!table) return;
        Object.keys(w).forEach(function(k) {
            var th = table.querySelector('.' + k);
            if (th) th.style.width = w[k] + 'px';
        });
    }

    function initResize() {
        var table = document.getElementById('tasks-datatable');
        if (!table) return;
        var ths = table.querySelectorAll('thead th');
        ths.forEach(function(th) {
            if (th.querySelector('a')) return;
            var handle = document.createElement('div');
            handle.className = 'col-resize-handle';
            handle.style.cssText = 'position:absolute;top:0;right:-2px;width:5px;height:100%;cursor:col-resize;z-index:10;';
            th.style.position = 'relative';
            th.appendChild(handle);

            var startX, startW;
            handle.addEventListener('mousedown', function(e) {
                e.preventDefault();
                startX = e.clientX;
                startW = th.offsetWidth;
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';

                function onMove(ev) {
                    var newW = Math.max(50, startW + ev.clientX - startX);
                    th.style.width = newW + 'px';
                }
                function onUp() {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                    var widths = {};
                    ths.forEach(function(t) {
                        var cls = Array.from(t.classList).find(function(c) { return c.startsWith('col-'); });
                        if (cls) widths[cls] = t.offsetWidth;
                    });
                    saveWidths(widths);
                }
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        applyWidths();
        initResize();
    });

    document.body.addEventListener('htmx:afterSwap', function(e) {
        if (e.detail.target.id === 'tasks-table-container') {
            applyWidths();
            initResize();
        }
    });
})();
</script>
{% endblock %}
