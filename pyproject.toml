[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arxiv-manager"
version = "0.1.0"
description = "AI-powered assistant for arXiv figure analysis and Q&A task authoring"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.9",
    "rich>=13.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "jinja2>=3.1",
    "sqlmodel>=0.0.14",
    "pymupdf>=1.23",
    "httpx>=0.24",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "imagehash>=4.2",
]

[project.scripts]
arxiv-manager = "arxiv_manager.cli:app"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
timeout = 60

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
per-file-ignores = {"src/arxiv_manager/authoring/_draft_prompts.py" = ["E501"], "src/arxiv_manager/authoring/_rule_groups.py" = ["E501"], "src/arxiv_manager/authoring/_history_context.py" = ["E501"], "src/arxiv_manager/authoring/ai_draft/core.py" = ["E501"], "src/arxiv_manager/cli/task_commands.py" = ["E501"], "src/arxiv_manager/sourcing/__init__.py" = ["E501"], "tests/*" = ["E501"]}

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_manager"]
